<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Merry Christmas</title>
  <style>
    :root { color-scheme: dark; background: #000; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #scene, #snow { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    #scene { z-index: 0; }
    #snow { z-index: 1; pointer-events: none; }
    .greeting {
      position: fixed;
      z-index: 2;
      top: 32.5%;
      left: clamp(20px, 2.5vw, 40px);
      color: #fff;
      font-family: "Monotype Corsiva", "URW Chancery L", "Brush Script MT", cursive;
      font-size: clamp(27px, 3vw, 45px);
      font-weight: 400;
      line-height: 1.12;
      text-shadow: 0 0 12px rgba(190, 220, 255, .3);
      pointer-events: none;
      user-select: none;
    }
    .greeting div + div { margin-top: 7px; }
    #message {
      position: fixed;
      z-index: 3;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #ddd;
      background: #000;
      font: 16px/1.5 system-ui, sans-serif;
      text-align: center;
    }
    #message[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Rotating particle Christmas tree"></canvas>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div class="greeting" aria-label="Merry Christmas 647">
    <div>Merry Christmas</div>
    <div>647</div>
  </div>
  <div id="message" hidden></div>

  <script>
    (() => {
      "use strict";

      const TREE_HEIGHT = 12;
      const TREE_POINTS = 50000;
      const GROUND_POINTS = 4000;
      const STAR_POINTS = 1200;
      const HEART_POINTS = 1000;
      const SNOW_POINTS = 10;
      const TAU = Math.PI * 2;
      const sceneCanvas = document.getElementById("scene");
      const snowCanvas = document.getElementById("snow");
      const message = document.getElementById("message");
      const gl = sceneCanvas.getContext("webgl", {
        alpha: false,
        antialias: true,
        powerPreference: "high-performance"
      });

      if (!gl) {
        message.hidden = false;
        message.textContent = "这个浏览器没有启用 WebGL，换用最新版 Chrome、Edge 或 Firefox 再打开试试。";
        return;
      }

      const vertexShaderSource = \`
        attribute vec3 aPosition;
        attribute vec3 aColor;
        uniform float uAngle;
        uniform vec2 uViewport;
        uniform float uDpr;
        varying vec3 vColor;
        varying float vFade;

        void main() {
          float ca = cos(uAngle);
          float sa = sin(uAngle);
          float xz = aPosition.x * ca - aPosition.z * sa;
          float zz = aPosition.x * sa + aPosition.z * ca;

          float cp = cos(-0.25);
          float sp = sin(-0.25);
          float yp = aPosition.y * cp - zz * sp - 6.0;
          float zp = aPosition.y * sp + zz * cp + 13.0;

          if (zp <= 0.1) {
            gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
            gl_PointSize = 0.0;
            vColor = aColor;
            vFade = 0.0;
            return;
          }

          float focal = uViewport.y * 0.63;
          float ndcX = xz * focal * 2.0 / (zp * uViewport.x);
          float ndcY = yp * focal * 2.0 / (zp * uViewport.y);
          float nearPlane = 0.1;
          float farPlane = 100.0;
          float zClip = ((farPlane + nearPlane) / (farPlane - nearPlane)) * zp
                      - (2.0 * farPlane * nearPlane / (farPlane - nearPlane));

          gl_Position = vec4(ndcX * zp, ndcY * zp, zClip, zp);
          gl_PointSize = max(1.0, 3.6 - zp * 0.13) * uDpr;
          vColor = aColor;
          vFade = clamp((farPlane - zp) / 30.0, 0.0, 1.0);
        }
      \`;

      const fragmentShaderSource = \`
        precision mediump float;
        varying vec3 vColor;
        varying float vFade;
        void main() {
          float distanceFromCenter = length(gl_PointCoord - vec2(0.5));
          float alpha = (1.0 - smoothstep(0.22, 0.5, distanceFromCenter)) * vFade;
          if (alpha < 0.015) discard;
          gl_FragColor = vec4(vColor, alpha);
        }
      \`;

      function compileShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const error = gl.getShaderInfoLog(shader);
          gl.deleteShader(shader);
          throw new Error(error || "Could not compile WebGL shader.");
        }
        return shader;
      }

      let program;
      try {
        program = gl.createProgram();
        gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vertexShaderSource));
        gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fragmentShaderSource));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program) || "Could not link WebGL program.");
        }
      } catch (error) {
        message.hidden = false;
        message.textContent = "圣诞树启动失败：" + error.message;
        return;
      }

      const positions = [];
      const colors = [];
      const rand = (min, max) => Math.random() * (max - min) + min;
      const randInt = (min, max) => Math.floor(rand(min, max + 1));
      const clampByte = value => Math.max(0, Math.min(255, value));
      const addPoint = (x, y, z, color) => {
        positions.push(x, y, z);
        colors.push(color[0] / 255, color[1] / 255, color[2] / 255);
      };

      function createTree() {
        const spiralCount = Math.floor(TREE_POINTS * 0.7);
        for (let i = 0; i < spiralCount; i++) {
          const u = Math.random();
          const h = Math.pow(u, 1.6);
          const y = TREE_HEIGHT * h + 0.2;
          let baseRadius = Math.pow(1 - h, 1.1) * 3.2;
          const branchWave = Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
          baseRadius *= 1 + 0.65 * branchWave;
          const angle = u * 9 * TAU + rand(-0.22, 0.22);
          const radius = baseRadius * rand(0.85, 1.08);
          const x = Math.cos(angle) * radius;
          const z = Math.sin(angle) * radius;

          let midBoost = Math.max(0.15, 1 - Math.abs(h - 0.55) * 1.5);
          const baseGreen = 155 + Math.floor(90 * midBoost);
          let color = [
            255,
            Math.min(255, baseGreen + randInt(-15, 20)),
            Math.min(255, 185 + Math.floor(70 * midBoost) + randInt(-15, 35))
          ];
          if (Math.random() < 0.08) color = [255, 255 - randInt(0, 35), 230 + randInt(0, 25)];
          addPoint(x, y, z, color.map(clampByte));
        }

        const fillCount = TREE_POINTS - spiralCount;
        for (let i = 0; i < fillCount; i++) {
          const h = Math.pow(Math.random(), 1.9);
          const y = TREE_HEIGHT * h + 0.2 + rand(-0.08, 0.08);
          let baseRadius = Math.pow(1 - h, 1.1) * 4.3;
          const branchWave = Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
          baseRadius *= 1 + 0.65 * branchWave;
          const radius = baseRadius * Math.sqrt(Math.random());
          const angle = Math.random() * TAU;
          const x = Math.cos(angle) * radius + rand(-0.08, 0.08);
          const z = Math.sin(angle) * radius + rand(-0.08, 0.08);
          addPoint(x, y, z, [255, randInt(165, 225), randInt(190, 250)]);
        }
      }

      function gaussian(mean, deviation) {
        const u1 = Math.max(Math.random(), 1e-8);
        const u2 = Math.random();
        return mean + deviation * Math.sqrt(-2 * Math.log(u1)) * Math.cos(TAU * u2);
      }

      function createGround() {
        const rings = [4.6, 6.0, 7.4, 8.8, 10.2, 11.4];
        for (let i = 0; i < GROUND_POINTS; i++) {
          const ring = rings[Math.floor(Math.random() * rings.length)];
          const radius = gaussian(ring, 0.3);
          const angle = Math.random() * TAU;
          const brightness = Math.random() < 0.15 ? randInt(235, 255) : randInt(190, 235);
          addPoint(Math.cos(angle) * radius, -0.25, Math.sin(angle) * radius,
                   [brightness, brightness, 255]);
        }
      }

      function createStars() {
        for (let i = 0; i < STAR_POINTS; i++) {
          const x = rand(-18, 18);
          const z = rand(-18, 18);
          const y = rand(3, 18);
          const base = randInt(215, 255);
          addPoint(x, y, z, [base, base, 255]);
        }
      }

      function createHeart() {
        let accepted = 0;
        while (accepted < HEART_POINTS) {
          const x = rand(-1.3, 1.3);
          const y = rand(-1.4, 1.4);
          const implicit = Math.pow(x * x + y * y - 1, 3) - x * x * Math.pow(y, 3);
          if (implicit > 0) continue;
          const worldX = x * 0.9 * 0.8;
          const worldY = TREE_HEIGHT + 0.05 + (y + 1) * 0.9 * 0.5;
          const worldZ = rand(-0.18, 0.18);
          const factor = Math.max(0.35, 1.15 - 0.5 * Math.hypot(x, y));
          const green = Math.max(120, Math.min(255, Math.floor(130 * factor + 80)));
          const blue = Math.max(120, Math.min(255, Math.floor(190 * factor + 70)));
          addPoint(worldX, worldY, worldZ, [255, green, blue]);
          accepted++;
        }
      }

      try {
        createTree();
        createGround();
        createStars();
        createHeart();
      } catch (error) {
        message.hidden = false;
        message.textContent = "生成粒子时出错：" + error.message;
        return;
      }

      const pointCount = positions.length / 3;
      const positionBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
      const colorBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);
      gl.useProgram(program);

      const positionLocation = gl.getAttribLocation(program, "aPosition");
      gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
      gl.enableVertexAttribArray(positionLocation);
      gl.vertexAttribPointer(positionLocation, 3, gl.FLOAT, false, 0, 0);
      const colorLocation = gl.getAttribLocation(program, "aColor");
      gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
      gl.enableVertexAttribArray(colorLocation);
      gl.vertexAttribPointer(colorLocation, 3, gl.FLOAT, false, 0, 0);

      const angleLocation = gl.getUniformLocation(program, "uAngle");
      const viewportLocation = gl.getUniformLocation(program, "uViewport");
      const dprLocation = gl.getUniformLocation(program, "uDpr");
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LEQUAL);
      gl.clearColor(0, 0, 0, 1);

      const snowContext = snowCanvas.getContext("2d");
      const flakes = [];
      let dpr = 1;

      function resetFlake(flake) {
        flake.x = rand(0, window.innerWidth);
        flake.y = rand(-80, -10);
        flake.radius = rand(10, 16);
        flake.speed = rand(30, 45);
        flake.life = (window.innerHeight + 80 - flake.y) / flake.speed;
        flake.maxLife = flake.life;
      }

      for (let i = 0; i < SNOW_POINTS; i++) {
        const flake = {};
        resetFlake(flake);
        flakes.push(flake);
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 1.75);
        const pixelWidth = Math.max(1, Math.floor(window.innerWidth * dpr));
        const pixelHeight = Math.max(1, Math.floor(window.innerHeight * dpr));
        if (sceneCanvas.width !== pixelWidth || sceneCanvas.height !== pixelHeight) {
          sceneCanvas.width = pixelWidth;
          sceneCanvas.height = pixelHeight;
          gl.viewport(0, 0, pixelWidth, pixelHeight);
        }
        if (snowCanvas.width !== pixelWidth || snowCanvas.height !== pixelHeight) {
          snowCanvas.width = pixelWidth;
          snowCanvas.height = pixelHeight;
          snowContext.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
      }

      function drawSnow(dt) {
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;
        snowContext.clearRect(0, 0, screenWidth, screenHeight);
        for (const flake of flakes) {
          flake.y += flake.speed * dt;
          flake.life -= dt;
          if (flake.life <= 0 || flake.y > screenHeight + 50) resetFlake(flake);

          const phase = flake.life / flake.maxLife;
          const alpha = phase > 0.3 ? 1 : Math.max(0, phase / 0.3);
          const radii = [1.3, 1, 0.75, 0.55, 0.45].map(value => Math.max(1, flake.radius * value));
          const alphas = [0.05, 0.083, 0.167, 0.333, 1];
          for (let i = 0; i < radii.length; i++) {
            snowContext.beginPath();
            snowContext.fillStyle = "rgba(255,255,255," + (alpha * alphas[i]) + ")";
            snowContext.arc(flake.x, flake.y, radii[i], 0, TAU);
            snowContext.fill();
          }
        }
      }

      let angle = 0;
      let previousTime = 0;
      function frame(time) {
        const dt = previousTime ? Math.min((time - previousTime) / 1000, 0.05) : 1 / 60;
        previousTime = time;
        angle += 0.0045 * dt * 60;
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.uniform1f(angleLocation, angle);
        gl.uniform2f(viewportLocation, sceneCanvas.width, sceneCanvas.height);
        gl.uniform1f(dprLocation, dpr);
        gl.drawArrays(gl.POINTS, 0, pointCount);
        drawSnow(dt);
        requestAnimationFrame(frame);
      }

      window.addEventListener("resize", resize, { passive: true });
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
